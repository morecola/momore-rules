# 版本：带家宽前置版 · GitHub Raw 规则源 (configs/mihomo-residential.yaml)
# 已绑定规则源仓库：https://github.com/morecola/momore-rules (release 分支)
# 部署前请将 proxies: [] 和 __PROXY_NODES__ 替换为你的实际节点或 proxy-providers 订阅

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - +.push.apple.com
    - Mijia Cloud
    - dlg.io.mi.com
dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::1/64
  fake-ip-filter:
    - rule-set:private
    - rule-set:category-ntp
    - rule-set:httpdns
    - rule-set:fakeip-filter
    - rule-set:pt-tracker
  use-hosts: false
  use-system-hosts: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  direct-nameserver-follow-policy: true
  nameserver:
    - 'https://8.8.8.8/dns-query#🚀 手动选择&ecs=223.5.5.0/24&ecs-override=true'
    - 'https://8.8.4.4/dns-query#🚀 手动选择&ecs=223.5.5.0/24&ecs-override=true'
  nameserver-policy:
    rule-set:httpdns: rcode://success
    rule-set:private: system
    rule-set:direct,category-ntp,pt-tracker,apple-cn,microsoft-cn,games-cn:
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    rule-set:proxy,gemini,google,ai,telegram,dev,scholar,non-cn:
      - https://1.1.1.1/dns-query#🚀 手动选择
      - https://8.8.8.8/dns-query#🚀 手动选择
    rule-set:cn:
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
proxies: []
proxy-groups:
  - name: 🚀 手动选择
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    proxies:
      - ♻️ 自动选择
      - __PROXY_NODES__
      - 🏡 家宽优选
  - name: ♻️ 自动选择
    type: url-test
    include-all-proxies: true
    exclude-filter: '-|Big|IPv6'
    exclude-type: ss
    proxies:
      - __PROXY_NODES__
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
  - name: 💻 前置节点
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big|IPv6'
    exclude-type: ss
    proxies:
      - ♻️ 自动选择
      - __PROXY_NODES__
  - name: 🤖 AI 服务
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    exclude-type: ss
    proxies:
      - 🚀 手动选择
      - ♻️ 自动选择
      - 🏡 家宽优选
      - __PROXY_NODES__
  - name: 🔍 谷歌服务
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    exclude-type: ss
    proxies:
      - 🚀 手动选择
      - ♻️ 自动选择
      - 🏡 家宽优选
      - __PROXY_NODES__
      - DIRECT
      - REJECT
  - name: 📲 电报消息
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    exclude-type: ss
    proxies:
      - 🚀 手动选择
      - ♻️ 自动选择
      - 🏡 家宽优选
      - __PROXY_NODES__
      - DIRECT
      - REJECT
  - name: 🛠️ 开发工具
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    exclude-type: ss
    proxies:
      - 🚀 手动选择
      - ♻️ 自动选择
      - 🏡 家宽优选
      - __PROXY_NODES__
      - DIRECT
      - REJECT
  - name: 📚 学术资源
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    exclude-type: ss
    proxies:
      - 🚀 手动选择
      - ♻️ 自动选择
      - 🏡 家宽优选
      - __PROXY_NODES__
      - DIRECT
      - REJECT
  - name: 🍎 苹果服务
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    exclude-type: ss
    proxies:
      - DIRECT
      - 🚀 手动选择
      - ♻️ 自动选择
      - __PROXY_NODES__
      - REJECT
  - name: Ⓜ️ 微软服务
    type: select
    include-all-proxies: true
    exclude-filter: '-|Big'
    exclude-type: ss
    proxies:
      - 🚀 手动选择
      - ♻️ 自动选择
      - __PROXY_NODES__
      - DIRECT
      - REJECT
  - name: 🏡 家宽优选
    type: select
    include-all-proxies: true
    filter: '-|Big'
    proxies:
      - __PROXY_NODES__
    # 如需链式前置转发，请在对应家宽节点或 proxy-providers.<name>.override 中配置：
    # dialer-proxy: 💻 前置节点

rules:
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,🚀 手动选择
  - RULE-SET,private,DIRECT
  - RULE-SET,lanip,DIRECT,no-resolve
  - RULE-SET,category-ntp,DIRECT
  - RULE-SET,httpdns,REJECT
  - RULE-SET,httpdns-ip,REJECT,no-resolve
  - RULE-SET,pt-tracker,DIRECT
  - AND,((NETWORK,udp),(DST-PORT,443),(OR,((RULE-SET,ai),(RULE-SET,gemini),(RULE-SET,google)))),REJECT
  - RULE-SET,gemini,🔍 谷歌服务
  - RULE-SET,google,🔍 谷歌服务
  - RULE-SET,ai,🤖 AI 服务
  - RULE-SET,telegram,📲 电报消息
  - DOMAIN,tf-feedback.itunes.apple.com,🍎 苹果服务
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - RULE-SET,games-cn,DIRECT
  - RULE-SET,scholar,📚 学术资源
  - AND,((RULE-SET,dev),(RULE-SET,non-cn)),🛠️ 开发工具
  - AND,((RULE-SET,apple),(RULE-SET,non-cn)),🍎 苹果服务
  - AND,((RULE-SET,microsoft),(RULE-SET,non-cn)),Ⓜ️ 微软服务
  - AND,((NETWORK,udp),(DST-PORT,443),(RULE-SET,non-cn)),REJECT
  - RULE-SET,non-cn,🚀 手动选择
  - RULE-SET,cn,DIRECT
  - RULE-SET,dev,🛠️ 开发工具
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,microsoft,Ⓜ️ 微软服务
  - RULE-SET,telegramip,📲 电报消息,no-resolve
  - RULE-SET,cnip,DIRECT
  - MATCH,🚀 手动选择

name: Sync & Build Mihomo Rules

on:
  # 每天北京时间 04:25 (UTC 20:25) 自动从多个上游拉取、去重并编译规则
  schedule:
    - cron: '25 20 * * *'
  # 修改 custom/、sources.json 或脚本推送到 main 分支时立即自动触发重编
  push:
    branches:
      - main
    paths:
      - 'custom/**'
      - 'sources.json'
      - 'scripts/**'
      - '.github/workflows/sync.yml'
  # 支持在 GitHub Actions 页面手动点击 Run workflow 立即构建
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mihomo-rules
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5

      - name: Install latest Mihomo binary for .mrs compilation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest")
          DOWNLOAD_URL=$(echo "${RELEASE_JSON}" | jq -r '
            (.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-v[0-9.]+\\.gz$")) | .browser_download_url)
            // (.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9.]+\\.gz$")) | .browser_download_url)
          ' | head -n 1)
          if [ -z "${DOWNLOAD_URL}" ] || [ "${DOWNLOAD_URL}" = "null" ]; then
            echo "Failed to locate mihomo-linux-amd64 release asset" >&2
            exit 1
          fi
          echo "Downloading ${DOWNLOAD_URL}"
          curl -fsSL "${DOWNLOAD_URL}" | gunzip > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          /usr/local/bin/mihomo -v

      - name: Aggregate multi-upstream rules, deduplicate & compile .mrs
        run: python3 scripts/sync.py --mihomo /usr/local/bin/mihomo

      - name: Publish artifacts to orphan release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(rules): auto sync $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/release

      - name: Purge jsDelivr CDN cache for release rules
        continue-on-error: true
        run: |
          for f in dist/rules/*; do
            fname=$(basename "$f")
            curl -fsS --max-time 5 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/rules/${fname}" > /dev/null || true
          done
          echo "jsDelivr CDN purge requests dispatched for $(ls -1 dist/rules | wc -l) files."
